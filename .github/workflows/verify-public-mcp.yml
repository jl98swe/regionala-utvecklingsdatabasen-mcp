name: Verify public MCP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-public-mcp.yml
      - scripts/smoke-client.ts
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run smoke -- https://regionala-utvecklingsdatabasen-mcp.jl98swe.workers.dev/mcp

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify embedded R templates
        run: |
          python3 scripts/embed-templates.py
          git diff --exit-code -- data/templates.json
      - run: npm run build
      - name: Real HTTP MCP client against Worker runtime
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/rud-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/health; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/rud-worker.log; exit 1; fi
          npm run smoke -- http://127.0.0.1:8787/mcp
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - run: node --import tsx scripts/export-code.ts
      - run: Rscript tests/r-checks.R

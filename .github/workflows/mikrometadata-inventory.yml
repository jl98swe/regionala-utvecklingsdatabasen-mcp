name: Inventera Mikrometadata
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main]
    paths: [scripts/inventory_mikrometadata.py, .github/workflows/mikrometadata-inventory.yml]
permissions:
  contents: write
concurrency:
  group: mikrometadata-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-mikrometadata.txt
      - run: pip install -r scripts/requirements-mikrometadata.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/inventory_mikrometadata.py
      - name: Spara verifierat SCB-index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mikrometadata-inventory*
          if ! git diff --cached --quiet; then
            git commit -m 'Inventera SCB-register och variabler för beställningsmatchning'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scb-inventory
          path: data/mikrometadata-inventory*

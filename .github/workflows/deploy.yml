name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/order-domains.ts
      - src/order-notes.ts
      - src/server.ts
      - data/order-source-index.json
      - data/order-source-review.json
  workflow_run:
    workflows: [Hämta värdemängder från SCB]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - run: node --import tsx scripts/export-code.ts
      - run: Rscript tests/r-checks.R
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            if [ "$EVENT_NAME" = workflow_run ]; then
              echo 'available=false' >> "$GITHUB_OUTPUT"
              echo '::warning::Data är sparad i GitHub. Automatisk publicering kräver Cloudflare-hemligheter.'
              echo 'Data är sparad. Worker-publicering hoppades över: CLOUDFLARE_API_TOKEN och/eller CLOUDFLARE_ACCOUNT_ID saknas.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets. Never paste credentials in chat.'
            exit 1
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - uses: cloudflare/wrangler-action@v3
        if: steps.credentials.outputs.available == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed MCP with SDK client
        if: steps.credentials.outputs.available == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then echo '::error::No deployment URL returned'; exit 1; fi
          verified=false
          for attempt in 1 2 3; do
            if npm run smoke -- "${DEPLOYMENT_URL%/}/mcp"; then verified=true; break; fi
            if [ "$attempt" != 3 ]; then sleep 5; fi
          done
          if [ "$verified" != true ]; then exit 1; fi
          echo "MCP endpoint: ${DEPLOYMENT_URL%/}/mcp" >> "$GITHUB_STEP_SUMMARY"

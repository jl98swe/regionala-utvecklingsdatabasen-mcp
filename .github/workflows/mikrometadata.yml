name: Hämta värdemängder från SCB
on:
  push:
    branches: [main]
    paths:
      - scripts/harvest_mikrometadata.py
      - scripts/requirements-mikrometadata.txt
      - .github/workflows/mikrometadata.yml
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      refresh_history:
        description: Kontrollera även tidigare hämtade historiska versioner
        type: boolean
        default: false
      max_checks:
        description: Max antal exporter/kontroller (0 = hela registret)
        type: string
        default: '0'
permissions:
  contents: write
concurrency:
  group: mikrometadata-catalog
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-mikrometadata.txt
      - run: pip install -r scripts/requirements-mikrometadata.txt
      - run: python -m playwright install --with-deps chromium
      - name: Hämta pilotregistret och spara återstartspunkter
        id: collect
        continue-on-error: true
        env:
          REFRESH_HISTORY: ${{ inputs.refresh_history || 'false' }}
          MAX_CHECKS: ${{ inputs.max_checks || '0' }}
        run: |
          args=()
          if [ "$REFRESH_HISTORY" = true ]; then args+=(--refresh-history); fi
          python scripts/harvest_mikrometadata.py --register 'Aktieägarstatistik' --max-checks "$MAX_CHECKS" "${args[@]}"
      - name: Verifiera exporterad katalog
        run: python -m unittest discover -s tests -p 'test_value_domains.py'
      - name: Spara data även vid avbruten hämtning
        if: always()
        run: |
          python -m unittest discover -s tests -p 'test_value_domains.py'
          if ! git diff --quiet -- data/value-domains.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/value-domains.json
            git commit -m 'Uppdatera SCB:s värdemängder för Aktieägarstatistiken'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/value-domains.json'))
          print('## Värdemängder från SCB')
          print(f"{len(d['bindings'])} variabel/version-kopplingar, {len(d['domains'])} unika värdemängder.")
          for name,state in d['registers'].items():
              print(f"- {name}: komplett={state['complete']}, källdatum={state['source_updated']}")
              for error in state.get('errors',[]): print(f'- Fel: {error}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mikrometadata-checkpoint
          path: data/value-domains.json
      - name: Markera hämtfel
        if: steps.collect.outcome == 'failure'
        run: exit 1
